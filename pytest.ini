[pytest]
testpaths = tests
pythonpath = .
base_url = https://demo.playwright.dev

addopts =
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --junitxml=reports/junit.xml
    --html=reports/report.html
    --self-contained-html

filterwarnings =
    # Raised by pytest-playwright 0.10's own base_url fixture on pytest 9.2+, not by this project
    ignore:Session-scoped fixtures defined as instance methods

markers =
    todomvc: TodoMVC demo app
    api_mocking: network interception and mocking on the API-mocking demo
    docs: playwright.dev documentation site
